name: release

# Tag a version and the upload-ready archive lands on the release page, so
# claude.ai users can install without cloning anything:
#
#   git tag v1.1.0 && git push origin v1.1.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build the archive for'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Never ship an archive that fails its own tests.
      - name: Self test
        run: ./scripts/selftest.sh

      - name: Build the claude.ai upload archive
        run: python3 scripts/make_web_zip.py -o crosspost-design.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" crosspost-design.zip --clobber
          else
            gh release create "$TAG" crosspost-design.zip \
              --title "crosspost-design $TAG" \
              --generate-notes
          fi
