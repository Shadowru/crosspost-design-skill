# CI для этого репозитория. Положите файл в .github/workflows/ci.yml.
#
# Отдельным файлом он лежит потому, что personal access token без scope
# `workflow` не может пушить в .github/workflows/ — ни через git, ни через
# Contents API. Варианты: выдать токену scope `workflow` и перенести файл
# обычным коммитом, либо создать его через веб-интерфейс GitHub.
#
# CI for this repository. Move it to .github/workflows/ci.yml.
# It ships here because a PAT without the `workflow` scope cannot push into
# .github/workflows/. Grant the scope, or create the file via the web UI.

name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run the end-to-end self test
        run: ./scripts/selftest.sh

      - name: Validate the plugin manifest the way the review pipeline does
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict
