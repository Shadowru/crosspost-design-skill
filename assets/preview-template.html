<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · paste preview</title>
<style>
  :root{color-scheme:light dark;}
  body{margin:0;background:#f2f3f5;color:#111827;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
       -webkit-text-size-adjust:100%;}
  .pd-bar{position:sticky;top:0;background:#fff;box-shadow:0 1px 10px rgba(0,0,0,.08);
          display:flex;align-items:center;justify-content:space-between;gap:12px;
          padding:11px 16px;z-index:99;}
  .pd-hint{font-size:13px;color:#6b7280;line-height:1.4;}
  .pd-hint b{color:#111827;}
  .pd-target{font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.08em;}
  .pd-copy{background:#111827;color:#fff;border:0;border-radius:9px;padding:10px 18px;
           font-size:14px;font-weight:650;cursor:pointer;white-space:nowrap;
           transition:transform .08s ease,opacity .15s ease;}
  .pd-copy:hover{opacity:.88;}
  .pd-copy:active{transform:translateY(1px);}
  .pd-toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#111827;
            color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;
            opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;
            box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:88vw;text-align:center;}
  .pd-toast.show{opacity:1;}
  .pd-stage{max-width:720px;margin:28px auto 72px;padding:28px 26px;background:#fff;
            border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .pd-stage h1,.pd-stage h2,.pd-stage h3,.pd-stage h4{line-height:1.3;}
  .pd-stage p,.pd-stage li{font-size:17px;line-height:1.65;}
  .pd-stage blockquote{margin:1em 0;padding:.2em 0 .2em 1em;border-left:3px solid #d1d5db;color:#374151;}
  .pd-stage aside{margin:1em 0;padding:.8em 1em;background:#f3f4f6;border-radius:8px;font-size:16px;}
  .pd-stage pre{background:#f3f4f6;padding:.9em 1em;border-radius:8px;overflow-x:auto;font-size:14px;}
  .pd-stage figure{margin:1.2em 0;}
  .pd-stage img{max-width:100%;height:auto;display:block;margin:0 auto;}
  .pd-stage figcaption{font-size:14px;color:#6b7280;text-align:center;margin-top:.5em;}
  .pd-stage table{border-collapse:collapse;width:100%;font-size:15px;}
  .pd-stage th,.pd-stage td{border:1px solid #e5e7eb;padding:.4em .6em;text-align:left;}
  @media (prefers-color-scheme:dark){
    body{background:#111315;color:#e5e7eb;}
    .pd-bar{background:#1b1e21;}
    .pd-hint{color:#9ca3af;} .pd-hint b{color:#f3f4f6;}
    .pd-copy{background:#e5e7eb;color:#111827;}
    .pd-stage{background:#1b1e21;box-shadow:none;}
    .pd-stage aside,.pd-stage pre{background:#24282c;}
    .pd-stage blockquote{border-left-color:#3f464d;color:#c3c8ce;}
    .pd-stage th,.pd-stage td{border-color:#333a40;}
  }
</style>
</head>
<body>
<div class="pd-bar">
  <span class="pd-hint">Rendered below · press <b>Copy</b>, then paste into the editor<br>
    <span class="pd-target">target: {{TARGET}}</span></span>
  <button class="pd-copy" id="pdCopyBtn" type="button">Copy formatted text</button>
</div>
<div class="pd-toast" id="pdToast"></div>
<div class="pd-stage">
  <div id="pd-content">
<!--POST_CONTENT-->
  </div>
</div>
<script>
  function pdToast(msg){
    var t=document.getElementById('pdToast');
    t.textContent=msg;t.classList.add('show');
    clearTimeout(t._timer);
    t._timer=setTimeout(function(){t.classList.remove('show');},2800);
  }
  function pdCopy(){
    var el=document.getElementById('pd-content');
    var range=document.createRange();
    range.selectNodeContents(el);
    var sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    var ok=false;
    try{ok=document.execCommand('copy');}catch(e){ok=false;}
    sel.removeAllRanges();
    var btn=document.getElementById('pdCopyBtn');
    if(ok){
      pdToast('Copied — paste into the editor with Ctrl/⌘+V');
      var old=btn.textContent;btn.textContent='Copied';
      setTimeout(function(){btn.textContent=old;},2200);
    }else{
      pdToast('Automatic copy failed — select all (Ctrl/⌘+A) and copy manually');
    }
  }
  document.getElementById('pdCopyBtn').addEventListener('click',pdCopy);
</script>
</body>
</html>
